name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: UrbanField
    env:
      SECRET_KEY: clave-solo-para-ci
      DJANGO_SETTINGS_MODULE: urbanfield_project.settings.local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: UrbanField/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Comprobar que no faltan migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar tests con cobertura
        run: |
          coverage run --source=gestion --omit='gestion/migrations/*,gestion/tests/*' manage.py test
          coverage report --fail-under=85

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t urbanfield:ci UrbanField
      - name: Validar docker-compose.yml
        working-directory: UrbanField
        run: cp .env.example .env && docker compose config --quiet
