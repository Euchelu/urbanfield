{% extends "base.html" %}
{% block contenido %}
  <h2>Iniciar sesión</h2>
  <div style="background:white;border-radius:8px;padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:400px;">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" style="background:#1a1a2e;color:white;padding:0.6rem 1.5rem;border:none;border-radius:4px;cursor:pointer;font-size:1rem;width:100%;margin-top:0.5rem;">Entrar</button>
    </form>
    <p style="margin-top:1rem;text-align:center;">
      ¿No tienes cuenta? <a href="{% url 'gestion:registro' %}">Regístrate</a>
    </p>
  </div>
{% endblock %}
