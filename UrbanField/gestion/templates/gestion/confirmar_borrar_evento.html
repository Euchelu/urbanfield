{% extends "base.html" %}
{% block contenido %}
  <h2>¿Borrar evento?</h2>
  <div style="background:white;border-radius:8px;padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:500px;">
    <p>¿Estás seguro de que quieres borrar <strong>{{ evento.titulo }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" style="background:#d9534f;color:white;padding:0.6rem 1.5rem;border:none;border-radius:4px;cursor:pointer;font-size:1rem;">Sí, borrar definitivamente</button>
      <a href="{% url 'gestion:detalle_evento' evento.slug %}" style="margin-left:1rem;color:#555;">Cancelar</a>
    </form>
  </div>
{% endblock %}
