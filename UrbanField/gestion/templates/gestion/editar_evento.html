{% extends "base.html" %}
{% block contenido %}
  <h2>Editar evento: {{ evento.titulo }}</h2>
  <div style="background:white;border-radius:8px;padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:500px;">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" style="background:#f0ad4e;color:white;padding:0.6rem 1.5rem;border:none;border-radius:4px;cursor:pointer;font-size:1rem;">Guardar cambios</button>
      <a href="{% url 'gestion:detalle_evento' evento.slug %}" style="margin-left:1rem;color:#555;">Cancelar</a>
    </form>
  </div>
{% endblock %}
